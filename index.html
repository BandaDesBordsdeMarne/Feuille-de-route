<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banda des Bords de Marne</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }

    #top-message {
      background-color: #000;
      padding: 30px 20px 25px;
      text-align: center;
      font-size: 1.8rem;
      line-height: 1.4;
      color: #c8102e; /* Rouge Banda */
    }

    #top-message .answer {
      color: white;
      display: block;
      margin-top: 8px;
      font-weight: bold;
      font-size: 2rem;
    }

    #joke-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    #joke-container .question {
      color: #c8102e;
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      white-space: pre-line;
    }

    #joke-container .answer {
      color: white;
      font-size: 1.8rem;
      white-space: pre-line;
    }

    #buttons-container {
      background-color: #000;
      padding: 15px 10px 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      border-top: 1px solid #c8102e;
    }

    button {
      background-color: #c8102e;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 1rem;
      white-space: nowrap;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #a00f23;
    }
  </style>
</head>
<body>

  <div id="top-message">
    Désolé pas encore de feuille de route ! Les infos arrivent toujours en retard... comme<br/>
    <span class="answer" id="late-answer">les Trombones</span>
  </div>

  <div id="joke-container">
    <div class="question" id="joke-question">Comment un jazz man fait-il pour devenir millionnaire ?</div>
    <div class="answer" id="joke-answer">il commence milliardaire !</div>
  </div>

  <div style="text-align:center; margin: 30px 0;">
    <h2 style="color:#c8102e;">📻 La Banda FM</h2>
    <iframe id="banda-fm" width="300" height="169" src="" 
      title="Playlist Banda" frameborder="0" allowfullscreen></iframe>
  </div>

  <div id="buttons-container">
    <button id="sound-button">🔊 Joue un instrument</button>
    <button id="quiz-button">🎭 Quel musicien es-tu ?</button>
    <button id="back-button">Retour à l’espace musiciens</button>
    <button id="new-joke-button">Encore une blague</button>
    <button id="play-game-button">Jouons ensemble</button>
  </div>

  <!-- Modal Quiz -->
  <div id="quiz-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000000dd; color:white; padding:20px; box-sizing:border-box; z-index:9999; overflow:auto;">
    <div style="max-width:500px; margin:auto; background:#222; padding:20px; border-radius:10px;">
      <h2 style="color:#c8102e;">🎭 Quel musicien es-tu ?</h2>
      <div id="quiz-content"></div>
      <div style="text-align:right; margin-top:20px;">
        <button onclick="closeQuiz()" style="background:#c8102e;color:white;padding:10px 20px;border:none;border-radius:6px;">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    // --- DATA ---
    const lateAnswers = [
      "Vanessa", "Le nouveau gouvernement", "Léo", "Rémi", "Angèle",
      "Garance", "Nataél", "Léandre", "Louise", "le carnet 2",
      "les Lopez", "les Ducournau", "les Trinquant",
      "La Thomann Family", "les Percussion et leur tempo :D ....",
      "la SNCF"
    ];

    const instrumentSounds = [
      "https://freesound.org/data/previews/441/441695_5665277-lq.mp3", // trompette
      "https://freesound.org/data/previews/35/35143_512123-lq.mp3",    // cymbales
      "https://freesound.org/data/previews/66/66717_634166-lq.mp3",    // tambour
      "https://freesound.org/data/previews/85/85962_95369-lq.mp3"      // trombone glissando
    ];

    const jokes = [
      { question: "Comment un jazz man fait-il pour devenir millionnaire ?", answer: "il commence milliardaire !" },
      { question: "Quel est le point commun entre les Beatles et les Percus de la Banda ?", answer: "Cela fait plus de 40 ans qu’ils ne jouent plus ensemble !" },
      { question: "Qu'est-ce qu'un demie ton en Banda ?", answer: "Deux Flûte qui jouent à l'unisson <3" },
      { question: "Le chef en répétition : - Trombone 2 tu joues trop fort !!!", answer: "Les autres : Il n'est pas là .... - Vous lui direz quand il reviendra !" },
      { question: "Pourquoi les Souba sont toujours en retard ?", answer: "Parce qu’ils suivent leur propre tempo" },
      { question: "Comment faire cuire un poisson avec son Eupho ?", answer: "Mettez-le dans le pavillon et jouez Do Ré La Sol" },
      { question: "Pourquoi les musiciens aiment faire le ménage ?", answer: "Car le Sol c'est Fa Si La Si Ré" },
      { question: "Quelle est la note qui est toujours malade", answer: "le Fa bémol parce qu’il vaut Mi" },
      { question: "Quelle est le point commun entre un sax alto et une grenade ?", answer: "Quand tu l’entends, c’est trop tard..." },
      { question: "Pourquoi les clarinettiste ont toujours une ferme ?", answer: "A force de faire des canards... " }
    ];

    const games = [
      "https://www.scriptendo.fr/Piano/lecture.php?j=entr#ancre",
      "https://www.apprendrelesolfege.com/jeux-pour-apprendre-le-solfege#title_2",
      "https://www.apprendrelesolfege.com/jeu-de-rythme",
      "https://elgoog.im/dino/",
      "https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw",
      "https://slopegame.io/",
      "https://www.incredibox.com/demo/",
      "https://musiclab.chromeexperiments.com/"
    ];

    const playlistId = "PL5rHMtGhoildYgE_vO3rzvD6fIKupivR9";

    const instrumentDescriptions = {
      trompette: "🎺 **Trompette** : Toujours plus fort, toujours plus haut. Tu te crois la star du show (et parfois tu l’es). Ton pire ennemi ? Le bouton de volume.",
      trombone: "🎷 **Trombone** : Tu glisses partout, dans la musique comme au bar. Tu es imprévisible, mais c’est ce qui fait ton charme (enfin… parfois).",
      clarinette: "🎶 **Clarinette** : Tu bosses sérieusement… mais tu lâches des canards mémorables. Personne ne sait si tu rigoles ou si tu pleures.",
      percu: "🥁 **Percu** : Tu cognes sur tout, tout le temps. Pour toi, une table, un gobelet ou une casserole c’est déjà un instrument. Ton voisin de chambre te déteste.",
      chef: "🧑‍🎤 **Chef** : Tu n’as pas d’instrument… mais tu as les bras. Et tu penses que ça suffit pour diriger tout ce petit monde (même si personne ne te regarde vraiment).",
      saxophone: "🎷 **Saxophone** : Tu improvises toujours, même sur ‘Au Clair de la Lune’. Tu crois être irrésistible, mais en vrai on attend juste que tu termines ton solo de 15 minutes.",
      flute: "🎵 **Flûte** : Tu joues discrètement, presque trop… jusqu’au moment où tu balances un aigu strident qui réveille tout le quartier."
    };

    // --- ELEMENTS ---
    const lateAnswerEl = document.getElementById("late-answer");
    const jokeQuestionEl = document.getElementById("joke-question");
    const jokeAnswerEl = document.getElementById("joke-answer");
    const backButton = document.getElementById("back-button");
    const newJokeButton = document.getElementById("new-joke-button");
    const playGameButton = document.getElementById("play-game-button");
    const soundButton = document.getElementById("sound-button");
    const quizButton = document.getElementById("quiz-button");
    const bandaFm = document.getElementById("banda-fm");

    // --- FUNCTIONS ---
    function randomFromArray(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateContent() {
      lateAnswerEl.textContent = randomFromArray(lateAnswers);
      const joke = randomFromArray(jokes);
      jokeQuestionEl.textContent = joke.question;
      jokeAnswerEl.textContent = joke.answer;
      loadRandomSong();
    }

    function loadRandomSong() {
      const startIndex = Math.floor(Math.random() * 20); // prend un titre au hasard dans la playlist
      bandaFm.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=${startIndex}`;
    }

    // --- EVENTS ---
    newJokeButton.addEventListener("click", updateContent);
    backButton.addEventListener("click", () => {
      window.location.href = "https://sites.google.com/bandadesbordsdemarne.com/public/espace-membres/infos-presta";
    });
    playGameButton.addEventListener("click", () => {
      const gameUrl = randomFromArray(games);
      window.open(gameUrl, "_blank");
    });
    soundButton.addEventListener("click", () => {
      const sound = new Audio(randomFromArray(instrumentSounds));
      sound.play();
    });

    quizButton.addEventListener("click", () => {
      startQuiz();
    });

    // --- QUIZ ---
    const quizQuestions = [
      { q: "Tu arrives à la répète :", a: { trompette:1, trombone:1, clarinette:1, percu:1, chef:1, saxophone:1, flute:1 } },
      { q: "On t’entend surtout :", a: { trompette:2, trombone:1, clarinette:1, percu:2, saxophone:1, flute:1 } },
      { q: "Ton accessoire indispensable :", a: { trompette:1, trombone:1, clarinette:1, percu:2, chef:2, saxophone:1, flute:1 } },
      { q: "Tu rates une note, tu fais quoi :", a: { trompette:1, trombone:1, clarinette:2, percu:1, saxophone:1, flute:2 } },
      { q: "Ton rêve secret :", a: { trompette:2, trombone:1, clarinette:1, percu:1, chef:2, saxophone:2, flute:1 } }
    ];

    function startQuiz() {
      let scores = { trompette:0, trombone:0, clarinette:0, percu:0, chef:0, saxophone:0, flute:0 };
      let index = 0;

      function showQuestion() {
        if (index >= quizQuestions.length) {
          showResult();
          return;
        }
        const q = quizQuestions[index];
        const div = document.getElementById("quiz-content");
        div.innerHTML = `<p style="font-size:1.2rem;margin-bottom:15px;">${q.q}</p>`;
        Object.keys(q.a).forEach(inst => {
          const btn = document.createElement("button");
          btn.textContent = inst.charAt(0).toUpperCase() + inst.slice(1);
          btn.style.margin = "5px";
          btn.onclick = () => { scores[inst]+=q.a[inst]; index++; showQuestion(); };
          div.appendChild(btn);
        });
      }

      function showResult() {
        let best = Object.keys(scores).reduce((a,b) => scores[a] > scores[b] ? a : b);
        const div = document.getElementById("quiz-content");
        div.innerHTML = `<h3>Tu es : ${instrumentDescriptions[best]}</h3>`;
      }

      document.getElementById("quiz-modal").style.display = "block";
      showQuestion();
    }

    function closeQuiz() {
      document.getElementById("quiz-modal").style.display = "none";
    }

    // --- INIT ---
    updateContent();
  </script>
</body>
</html>
